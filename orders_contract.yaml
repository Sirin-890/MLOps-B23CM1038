# DATA CONTRACT: E-commerce Order Stream
#
# SUMMARY
#
# This data is produced by the Order Processing System
# and used by the Marketing Dashboard team.
#
# Why this data matters:
# During Black Friday flash sales, the dashboard uses real-time
# order data to adjust ad spending based on conversions.
#
# What went wrong last year:
# - Orders with negative totals broke revenue calculations
# - Unknown status codes (for example, code 7) caused crashes
# - The dashboard only supports these statuses:
#   PAID, SHIPPED, CANCELLED
#
# What we agreed to do:
# - Convert internal status codes into clear text values
# - Reject any status code that is not mapped
# - Enforce that order totals are never negative
#
# Approved on: 2024-11-01
# Purpose: Black Friday readiness


dataContractSpecification: 0.9.3
id: urn:datacontract:ecommerce:flash-sale-orders
version: 1.0.0

#───────────────────────────────────────────────────────────────────────────
# 1. OWNERSHIP & GOVERNANCE
#───────────────────────────────────────────────────────────────────────────

info:
  title: "E-commerce Flash Sale Order Stream"
  description: |
    Real-time order events for Black Friday and promotional campaigns.
    Primary use: Marketing dashboard for dynamic ad spend optimization.
    Includes order totals and mapped status values.
  owner: "Order Processing Team"
  contact:
    name: "E-commerce Platform Lead"
    email: "platform@ecommerce.com"
    slack: "#ecommerce-data"
  classification: internal
  tags: [ecommerce, orders, black-friday, marketing, real-time]

#───────────────────────────────────────────────────────────────────────────
# 2. SCHEMA DEFINITION (Logical Contract)
#───────────────────────────────────────────────────────────────────────────

schema:
  type: object
  properties:
    order_total:
      type: number
      minimum: 0
      description: |
        Total order amount in USD, including tax and shipping.
        Must be non-negative. Zero-dollar orders allowed for promotional items.
      pii: false
      # physical_mapping: o_total

    status:
      type: string
      enum: [PAID, SHIPPED, CANCELLED]
      description: |
        Order fulfillment status as business-friendly string.
        Mapped from physical status codes:
          2 → PAID (payment confirmed)
          5 → SHIPPED (order dispatched)
          9 → CANCELLED (order cancelled by customer or system)
        
        IMPORTANT: Only these three values are valid. Any unmapped code
        (e.g., 7, 3, etc.) must be rejected to prevent dashboard crashes.
      pii: false
      # physical_mapping: status_code (integer codes)

  required:
    - order_total
    - status

#───────────────────────────────────────────────────────────────────────────
# 3. SERVICE LEVEL AGREEMENTS (SLAs)
#───────────────────────────────────────────────────────────────────────────

sla:
  freshness:
    threshold: "5 seconds"
    description: "Real-time stream for Black Friday flash sale optimization"
  availability:
    percentage: "99.99%"
    description: "Critical availability during promotional events"
  retention:
    period: "90 days"
    description: "Campaign performance analysis retention period"

#───────────────────────────────────────────────────────────────────────────
# 4. DATA QUALITY RULES
#───────────────────────────────────────────────────────────────────────────

quality:
  # Rule 1: Order total must be non-negative (CRITICAL)
  - name: order_total_non_negative
    type: validity
    expression: "order_total >= 0"
    threshold: "100%"
    enforcement: hard
    description: |
      Order total must never be negative.
      Last year's bug with negative totals broke revenue calculations.
      Zero-dollar orders are valid for promotional campaigns.

  # Rule 2: Status must be valid enum (CRITICAL)
  - name: status_valid_enum
    type: validity
    expression: "status IN ('PAID', 'SHIPPED', 'CANCELLED')"
    threshold: "100%"
    enforcement: hard
    description: |
      Only mapped status values accepted: PAID, SHIPPED, CANCELLED.
      This prevents dashboard crashes from unmapped codes.
      Unmapped codes like 7 are explicitly rejected.

  # Rule 3: Reject unmapped status codes at source (UPSTREAM VALIDATION)
  - name: status_code_mapping_valid
    type: validity
    expression: "status_code IN (2, 5, 9)"
    threshold: "100%"
    enforcement: hard
    description: |
      Physical status code validation (applied at ingestion layer).
      Only codes 2, 5, and 9 are valid and can be mapped.
      Any other code (e.g., 1, 3, 4, 6, 7, 8, 10+) triggers rejection.
      
      This is the circuit breaker that prevents unmapped codes from
      entering the pipeline and crashing the dashboard.
